[project]
name = "flow-meter-processor"
version = "0.1.0"
description = "Doover processor turning raw flow meter signals into flow rate and volume"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydoover>=1.18.8",
]

[project.scripts]
export-config = "flow_meter_processor.app_config:export"
export-ui = "flow_meter_processor.app_ui:export"
export-notifications = "flow_meter_processor.app_notifications:export"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flow_meter_processor"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
